<style>
/* Layout: navy top bar with orange rule, one content column. Home = navy hero with live counts, then a grid of menu tiles. Inner pages = white panels with soft shadow. */
:root{
  color-scheme:light; --bg:#FFFFFF; --surface:#FFFFFF; --ink:#14213D; --muted:#5F6C82; --line:#DEE4EE; --soft:#F2F5FA;
  --navy:#14284B; --navy2:#1F4079; --accent:#1F4079; --accent-ink:#FFFFFF; --accent-soft:#E8EEF8;
  --brand:#E8751A; --brand-ink:#B85A0E; --brand-soft:#FDEEDD;
  --ok:#1D7A4D; --ok-soft:#DFF1E7; --warn:#A5620A; --warn-soft:#FCEFD2; --bad:#B3261E; --bad-soft:#F9E0DD;
  --shadow:0 1px 2px rgba(20,40,75,.06),0 12px 30px -16px rgba(20,40,75,.22);
  --f-display:'Plus Jakarta Sans','Segoe UI',system-ui,Arial,sans-serif;
  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(90deg,var(--navy),var(--navy2));border-bottom:3px solid var(--brand);color:#fff;
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:none;border:0;cursor:pointer;padding:2px 0;color:#fff;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:16.5px;letter-spacing:.005em;line-height:1.2}
.brand span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72);line-height:1.2}
.logo{display:flex;align-items:center;justify-content:center;width:46px;height:46px;flex:none;border:1px solid rgba(255,255,255,.45);border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;padding:4px}
.logo:hover,.logo:focus-within{border-color:var(--brand)}
.logo img{max-width:100%;max-height:100%;display:block}
.logo svg{width:26px;height:26px;stroke:var(--navy2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.crumb{color:rgba(255,255,255,.78);font-size:13px}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bar .who{color:rgba(255,255,255,.8)}
.bar .who small{font-size:11px;opacity:.85;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.14)}
.bar .who #who{color:#fff;font-weight:600}
#gate{position:fixed;inset:0;z-index:999;background:#fff;display:none;align-items:center;justify-content:center;padding:24px}
#gate .gc{max-width:440px;width:100%;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 40px rgba(20,40,75,.12);text-align:center}
#gate h2{margin:0 0 8px;color:var(--navy)}#gate p{color:var(--muted);margin:6px 0 16px}
@media print{#gate{display:none!important}}
.bar .who select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.32);border-radius:10px;padding:5px 10px;color:#fff}
.bar .who select option{color:var(--ink);background:#fff}
.wrap{max-width:1080px;margin:0 auto;padding-top:28px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:6px}
.head h1{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.head p{margin:0;color:var(--muted);max-width:64ch}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);font-weight:500}
.tag::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--brand)}
.strip{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 30px;background:linear-gradient(115deg,var(--navy) 0%,var(--navy2) 75%);color:#fff;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:center;box-shadow:var(--shadow)}
.hero-art{position:absolute;right:0;bottom:0;height:100%;width:52%;pointer-events:none}
.hero-t,.hero-s{position:relative;z-index:1}
.hero .tag{color:#FFB574} .hero .tag::before{background:var(--brand)}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin-top:6px;color:#fff}
.hero p{margin:8px 0 0;color:rgba(255,255,255,.8);max-width:46ch}
.hero-s{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.hstat{display:flex;flex-direction:column;gap:3px;min-width:0;text-decoration:none;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:11px 14px}
.hstat:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.hstat:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hstat .hl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFB574}
.hstat .hs{font-size:12px;color:rgba(255,255,255,.78)}
.hstat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
@media (max-width:760px){.hero{padding:20px}.hero-art{opacity:.45}}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer;min-width:0;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.t-a{--tint:#E4ECF9;--hue:#1F4079} .t-o{--tint:#DDF1E6;--hue:#1D7A4D} .t-w{--tint:#FCE9D6;--hue:#B85A0E} .t-s{--tint:#ECEFF4;--hue:#5F6C82}
.art{background:linear-gradient(160deg,var(--tint) 0%,#FFFFFF 150%);padding:10px 12px 0;height:78px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.art svg{width:100%;max-width:150px;height:68px;display:block}
.art .s{stroke:var(--hue);stroke-width:2;fill:#FFFFFF;stroke-linejoin:round;stroke-linecap:round}
.art .l{stroke:var(--hue);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .h{fill:var(--hue);stroke:none}
.art .m{fill:#D5DCE8;stroke:none}
.art .k{fill:var(--tint);stroke:var(--hue);stroke-width:2}
.tb{display:flex;flex-direction:column;gap:4px;padding:12px 14px 13px;flex:1}
.tile:hover{border-color:var(--hue)}
.tile:focus-visible,.btn:focus-visible,.brand:focus-visible,select:focus-visible,input:focus-visible,tr[data-open]:focus-visible,tr[data-mopen]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tile h3{font-size:15px;font-weight:700;color:var(--navy)}
.tile p{margin:0;color:var(--muted);font-size:12.2px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{margin-top:auto;padding-top:6px;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--hue)}

/* ===== Beranda penuh layar ===== */
.head p{display:none}
#frm .head p{display:block}
body.homev .bar-in{max-width:1360px}
body.homev .wrap{max-width:1360px;padding-inline:20px}
@media (min-width:1000px){
 body.homev .wrap{display:grid;grid-template-rows:auto auto;gap:18px;padding-bottom:22px;align-content:start}
 body.homev .menu{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
 body.homev .hero{padding:24px 32px;grid-template-columns:minmax(0,.7fr) minmax(0,2.3fr)}
 body.homev .hero h1{font-size:32px}
 body.homev .hero-s{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}

 body.homev .tile h3{font-size:16px}

}

body.homev .hero{background:radial-gradient(900px 300px at 85% 0%,rgba(255,138,43,.22),transparent 60%),linear-gradient(115deg,var(--navy) 0%,var(--navy2) 80%)}
body.homev .hero-art{opacity:.3}
body.homev .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--brand),#FFB574,var(--brand))}
.fine{margin:0;color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15.5px;font-weight:700;color:var(--navy)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:10px 14px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tr[data-open],tr[data-mopen]{cursor:pointer}
tr[data-open]:hover td,tr[data-mopen]:hover td{background:#F7F9FD}
td.num,th.num{text-align:right}
.mono{font-family:var(--f-mono);font-size:12.5px}
.late td.dt{color:var(--bad);font-weight:700}
.done td{color:var(--muted)}
.stagehd td{background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px}
.bar-t{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:90px}
.bar-t i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#3A66B0)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{background:var(--navy);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px;padding:18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.w2{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,64,121,.14);outline:none}
.fld small{color:var(--muted);font-size:12px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 16px;margin:18px;border:2px dashed #C3CEDF;border-radius:16px;background:var(--soft);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-display);font-size:16px;color:var(--navy)}

.drop span.btn{color:var(--accent-ink)}

.drop:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.drop.sm{padding:16px;gap:6px}
.cell{width:100%;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px;font-size:13px;font-family:inherit;color:var(--ink);resize:none;min-width:0}
.cell:hover{border-color:var(--line)} .cell:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px rgba(31,64,121,.12)}
input.cell.r,td.r{text-align:right}

.fld input[readonly]{background:var(--soft);cursor:default}

    <span>Periksa hasil bacaan dulu, koreksi bila ada yang keliru.</span></div>`}

function terb(n){n=Math.floor(n);if(n<12)return SATU[n];if(n<20)return terb(n-10)+' belas';
  if(n<100)return terb(Math.floor(n/10))+' puluh'+(n%10?' '+terb(n%10):'');
  if(n<200)return 'seratus'+(n%100?' '+terb(n%100):'');
  if(n<1000)return terb(Math.floor(n/100))+' ratus'+(n%100?' '+terb(n%100):'');
  if(n<2000)return 'seribu'+(n%1000?' '+terb(n%1000):'');
  if(n<1e6)return terb(Math.floor(n/1000))+' ribu'+(n%1000?' '+terb(n%1000):'');
  const U=[[1e12,'triliun'],[1e9,'miliar'],[1e6,'juta']];
  for(const [v,w] of U)if(n>=v){const q=Math.floor(n/v),r=n%v;return terb(q)+' '+w+(r?' '+terb(r):'')}
  return String(n)}

${RK_L(0,'1.','Memperhatikan :')}

function rksCopy(){
  const el=document.getElementById('rksdoc'),msg=document.getElementById('rksmsg');if(!el)return;
  const ok='Surat tersalin. Tempel di Word dengan Ctrl+V.',no='Penyalinan ditolak browser. Blok isi surat secara manual lalu salin.';
  let done=false;
  try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);done=document.execCommand('copy');s.removeAllRanges()}catch(_){}
  if(done){msg.textContent=ok;return}
  (navigator.clipboard?navigator.clipboard.writeText(el.innerText):Promise.reject()).then(()=>{msg.textContent='Teks tersalin tanpa format. '+ok.slice(15)}).catch(()=>{msg.textContent=no})}

V.sign=()=>{
  const c=(k,i,v,ph='')=>`<input class="cell" data-sgl="${i}" data-k="${k}" value="${esc(v)}" placeholder="${ph}" aria-label="${k} baris ${i+1}">`;
  return `<div class="panel"><div class="panel-h"><h2>Daftar penandatangan</h2><span class="chip">${SGL.length} pejabat</span><span class="sp"></span><span class="src" id="sgmsg"></span><button class="btn pri sm" data-act="sg-add">Tambah pejabat</button></div>
   <div class="scroll"><table class="uni"><thead><tr><th style="min-width:260px">Jabatan</th><th style="min-width:280px">Nama</th><th style="min-width:130px">NIPP</th><th></th></tr></thead><tbody>

    else if(f==='mppl'){r[f]=Number((e.target.value.match(/\d+/)||[0])[0])||'';e.target.value=r[f]}
    else r[f]=e.target.value;

  if(e.target.id==='mitfile'&&e.target.files[0]){readMitra(e.target.files[0]);return}
  if(e.target.dataset&&e.target.dataset.m!==undefined&&mSel!==null&&e.target.closest('#mitform')){MIT[mSel][e.target.dataset.m]=e.target.value;return}

  if(e.target.dataset&&e.target.dataset.st!==undefined){const p=pkg(cur);p.st[e.target.dataset.st]=e.target.value;render()}
});

  if(E){Object.assign(E,common);push(E.mon);if(E.dt){const G=gen(E,true),ks=G.findIndex(x=>x.dok.startsWith('Selesai pekerjaan')),sp=G.findIndex(x=>x.dok.startsWith('Surat Perintah Kerja'));E.dt[ks]=iso(snap(add(d0(E.dt[sp]),E.pen-1)))}cur=E.id;const back=(prefill&&prefill.back)||'timeline';prefill=null;location.hash=back;return}
  const mi=Number(v('f_no')),r=MON[mi],p={id:nextId++,no:monNo(r,mi),nama:v('f_nama').trim(),rab:Number(v('f_rab')),pr:v('f_pr').trim(),done:0,proc:0,contoh:false,st:{},mon:r,...common,tglRab:iso(snap(TODAY)),tglPD:iso(snap(r&&r.tglpr?d0(r.tglpr):add(TODAY,7))),tglUji:iso(snap(add(TODAY,45))),tglBayar:iso(snap(add(TODAY,53)))};
  ensureDt(p);push(r);P.push(p);cur=p.id;prefill=null;location.hash='timeline';

/* ===== Penyimpanan database dan login 2 admin ===== */
const SAVE={db:null,uid:null,owner:false,slots:[],names:{},ready:false,last:'',img:{},busy:false,tab:Math.random().toString(36).slice(2,9),pending:null};
const pgate=h=>{let o=document.getElementById('gate');if(!o){o=document.createElement('div');o.id='gate';document.body.appendChild(o)}o.innerHTML=h?`<div class="gc">${h}</div>`:'';o.style.display=h?'flex':'none'};
const setSt=t=>{const e=document.getElementById('savest');if(e)e.textContent=t};
const snapState=()=>JSON.stringify({P:P.map(p=>({...p,mon:MON.indexOf(p.mon)})),MON,MIT,SGL,nextId,cur});
function applyState(str){const o=JSON.parse(str);MON=o.MON;MIT=o.MIT;P.length=0;o.P.forEach(p=>{p.mon=p.mon>=0?MON[p.mon]:undefined;P.push(p)});SGL.length=0;o.SGL.forEach(x=>SGL.push(x));nextId=o.nextId;cur=o.cur;syncSign()}
const IMG={top:{get:()=>KOP.top||'',set:v=>{KOP.top=v}},bot:{get:()=>KOP.bot===FOOTDEF?'':KOP.bot||'',set:v=>{KOP.bot=v||FOOTDEF}},logo:{get:()=>{const i=document.getElementById('logoimg');return i&&!i.hidden&&i.src.startsWith('data:')?i.src:''},set:v=>{if(v)setLogo(v)}}};
const CH=80000;
async function putBlob(name,str){const n=Math.max(1,Math.ceil(str.length/CH));for(let i=0;i<n;i++)await SAVE.db.doc('store/'+name+'_'+i).set({s:str.slice(i*CH,(i+1)*CH)});await SAVE.db.doc('store/'+name).set({n,by:SAVE.tab,at:Date.now()})}
async function getBlob(name){const m=await SAVE.db.doc('store/'+name).get();if(!m.exists)return null;const n=m.data().n;let o='';for(let i=0;i<n;i++){const d=await SAVE.db.doc('store/'+name+'_'+i).get();if(!d.exists)return undefined;o+=d.data().s}return o}
async function tick(){if(!SAVE.ready||SAVE.busy)return;SAVE.busy=true;try{
  const st=snapState();if(st!==SAVE.last){setSt('Menyimpan…');await putBlob('data',st);SAVE.last=st}
  for(const k in IMG){const v=IMG[k].get();if(v!==SAVE.img[k]){if(v.length>3e6){setSt('Gambar terlalu besar');SAVE.img[k]=v;continue}await putBlob('img_'+k,v);SAVE.img[k]=v}}
  setSt('Tersimpan')}catch(e){setSt('Gagal menyimpan')}finally{SAVE.busy=false}}
function applyRemote(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){setTimeout(applyRemote,2500);return}
  const f=SAVE.pending;SAVE.pending=null;if(f)f();render(true)}
function watch(name,onStr){let first=true;SAVE.db.doc('store/'+name).onSnapshot(async sn=>{if(first){first=false;return}if(!sn.exists)return;const d=sn.data();if(d.by===SAVE.tab)return;
  try{const str=await getBlob(name);if(!str&&str!=='')return;onStr(str)}catch(_){}},()=>{})}
const roleName=i=>i===0?'Admin 1 (input)':i===1?'Admin 2 (verifikasi)':'Pemilik';
async function resolveNames(user){try{const ps=await user.profiles(SAVE.slots.filter(Boolean));for(const id in ps)SAVE.names[id]=ps[id].name||''}catch(_){}}
function showWho(){const i=SAVE.slots.indexOf(SAVE.uid),e=document.getElementById('who');if(e)e.textContent=(SAVE.me&&SAVE.me.name?SAVE.me.name+' · ':'')+roleName(i>=0?i:(SAVE.owner?-1:-2))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-slot-del]');if(!b||!SAVE.db||!SAVE.owner)return;const i=Number(b.dataset.slotDel),sl=SAVE.slots.slice();sl.splice(i,1);SAVE.db.doc('store/admins').set({slots:sl}).then(()=>{SAVE.slots=sl;render(true)})});
const bkMsg=t=>{const e=document.getElementById('bkmsg');if(e)e.textContent=t};
document.addEventListener('click',async e=>{
  if(e.target.id==='bkimp'){document.getElementById('bkfile').click();return}
  if(e.target.id!=='bkexp')return;
  const img={};for(const k in IMG)img[k]=IMG[k].get();
  const txt=JSON.stringify({app:'dokumen-pengadaan',v:1,at:new Date().toISOString(),state:snapState(),img});
  const nm='cadangan-dokumen-pengadaan-'+new Date().toISOString().slice(0,10)+'.json';
  try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){const r=await dl.save({filename:nm,data:txt});bkMsg(r&&r.status==='saved'?'Tersimpan di perangkat':'Dibatalkan')}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=nm;document.body.appendChild(a);a.click();a.remove();bkMsg('File diunduh')}
  }catch(_){bkMsg('Gagal mengekspor')}});
document.addEventListener('change',async e=>{
  if(e.target.id!=='bkfile')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(o.app!=='dokumen-pengadaan'||!o.state)throw 0;JSON.parse(o.state);
    if(!confirm('Ganti seluruh data sekarang dengan isi file ini?'))return;
    applyState(o.state);for(const k in IMG)if(o.img&&typeof o.img[k]==='string')IMG[k].set(o.img[k]);
    render(true);bkMsg('Data diimpor'+(SAVE.ready?' dan sedang disimpan':''))}
  catch(_){bkMsg('File tidak valid')}},true);
async function boot(){
  pgate('<h2>Memuat data…</h2><p>Menghubungkan ke database.</p>');
  if(window.__fbReady)await window.__fbReady;
  const tmo=new Promise(r=>setTimeout(()=>r('timeout'),12000));
  const run=(async()=>{
    if(!window.claude||!claude.use)return 'local';
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return 'local';
    SAVE.db=db;const me=await user.me();SAVE.me=me;SAVE.uid=me.id;SAVE.owner=me.isOwner;
    if(!me.id&&!me.isOwner)return 'noid';
    const FB=!!window.__fbAdmins;
    if(FB){SAVE.slots=window.__fbAdmins.slice(0,2);if(SAVE.slots.indexOf(me.id)<0)return 'full'}
    const adRef=db.doc('store/admins');let d=FB?{slots:SAVE.slots}:((await adRef.get()).data()||{slots:[]});SAVE.slots=d.slots||[];
    let idx=SAVE.slots.indexOf(me.id);
    if(!FB&&idx<0&&(SAVE.slots.length<2||!me.isOwner)){
      if(SAVE.slots.length>=2)return 'full';
      const ok=await new Promise(res=>{pgate(`<h2>Masuk</h2><p>${esc(me.name||'Pengguna')}, slot <b>Admin ${SAVE.slots.length+1}</b> masih kosong. Daftar dan masuk sebagai admin?</p><button class="btn pri" id="gjoin">Masuk sebagai Admin ${SAVE.slots.length+1}</button>`);document.getElementById('gjoin').onclick=()=>res(true)});
      pgate('<h2>Mendaftarkan…</h2>');
      const l=await db.doc('store/claim').acquire({holder:me.id,ttlMs:8000});
      if(!l.acquired)return 'busy';
      d=(await adRef.get()).data()||{slots:[]};SAVE.slots=d.slots||[];
      if(SAVE.slots.indexOf(me.id)<0){if(SAVE.slots.length>=2)return 'full';SAVE.slots.push(me.id);await adRef.set({slots:SAVE.slots})}
    }
    await resolveNames(user);
    const str=await getBlob('data');
    if(str){applyState(str);SAVE.last=str}
    for(const k in IMG){const v=await getBlob('img_'+k);if(v!==null&&v!==undefined){IMG[k].set(v);SAVE.img[k]=v}else SAVE.img[k]=IMG[k].get()}
    if(!FB)adRef.onSnapshot(async sn=>{const dd=sn.data()||{slots:[]};SAVE.slots=dd.slots||[];await resolveNames(user);showWho();
      if(SAVE.uid&&!SAVE.owner&&SAVE.slots.indexOf(SAVE.uid)<0){SAVE.ready=false;pgate('<h2>Akses dilepas</h2><p>Slot admin Anda dilepas oleh pemilik. Muat ulang halaman untuk mendaftar kembali jika slot masih ada.</p>')}
      else if((location.hash||'').replace('#','')==='admin')render(true)},()=>{});
    watch('data',str=>{SAVE.pending=()=>{applyState(str);SAVE.last=str};applyRemote()});
    for(const k in IMG)watch('img_'+k,v=>{SAVE.pending=()=>{IMG[k].set(v);SAVE.img[k]=v};applyRemote()});
    return 'ok'})();
  let r;try{r=await Promise.race([run,tmo])}catch(e){r='error'}
  const msg={noid:'Anda belum masuk. Masuk ke claude.ai lalu buka kembali halaman ini.',full:'Dua admin sudah terdaftar. Minta pemilik halaman melepas satu slot.',busy:'Pendaftaran sedang diproses orang lain. Muat ulang halaman.'};
  if(msg[r]){pgate(`<h2>Tidak bisa masuk</h2><p>${msg[r]}</p>`);return}
  if(r==='ok'){SAVE.ready=true;pgate('');showWho();render(true);setSt('Tersimpan');setInterval(tick,2000);tick()}
  else{pgate('');SAVE.db=null;const w=document.getElementById('who');if(w)w.textContent='Mode lokal';setSt(r==='local'?'Data tidak tersimpan':'Database tidak terjangkau')}
}
render();
boot();
</script>
